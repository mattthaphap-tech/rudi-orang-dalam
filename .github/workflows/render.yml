name: Render Rudi Orang Dalam (chunked)

on:
  workflow_dispatch:

jobs:
  render-chunk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { start: 0, end: 331 }
          - { start: 332, end: 663 }
          - { start: 664, end: 995 }
          - { start: 996, end: 1327 }
          - { start: 1328, end: 1659 }
          - { start: 1660, end: 1991 }
          - { start: 1992, end: 2323 }
          - { start: 2324, end: 2654 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Google Chrome
        run: |
          wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get update
          sudo apt-get install -y ./google-chrome-stable_current_amd64.deb
          google-chrome --version
      - name: Install dependencies
        run: npm install
      - name: Reassemble audio (VO + bed)
        run: |
          mkdir -p public/audio
          cat audio-parts/vo.wav.b64.part-* | base64 -d > public/audio/Rudi-Orang-Dalam.wav
          cat audio-parts/bed.wav.b64.part-* | base64 -d > public/audio/orang-dalam-bed.wav
          ls -la public/audio/
      - name: Render chunk ${{ matrix.start }}-${{ matrix.end }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/render-chunk-orang-dalam.mjs ${{ matrix.start }} ${{ matrix.end }}
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.start }}-${{ matrix.end }}
          path: out/orang-dalam/chunks/chunk-${{ matrix.start }}-${{ matrix.end }}.mp4
          retention-days: 7

  concat:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [render-chunk]
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
      - name: Reassemble audio (VO + bed)
        run: |
          mkdir -p public/audio
          cat audio-parts/vo.wav.b64.part-* | base64 -d > public/audio/Rudi-Orang-Dalam.wav
          cat audio-parts/bed.wav.b64.part-* | base64 -d > public/audio/orang-dalam-bed.wav
          ls -la public/audio/
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-*
          path: chunks
          merge-multiple: true
      - name: Concat + mux audio (VO 1.0 + bed 0.68)
        run: |
          ls -la chunks/
          printf "file 'chunks/chunk-0-331.mp4'\nfile 'chunks/chunk-332-663.mp4'\nfile 'chunks/chunk-664-995.mp4'\nfile 'chunks/chunk-996-1327.mp4'\nfile 'chunks/chunk-1328-1659.mp4'\nfile 'chunks/chunk-1660-1991.mp4'\nfile 'chunks/chunk-1992-2323.mp4'\nfile 'chunks/chunk-2324-2654.mp4'\n" > concat.txt
          cat concat.txt
          ffmpeg -y -f concat -safe 0 -i concat.txt -c copy video_nocaps.mp4
          ffmpeg -y -i video_nocaps.mp4 -i public/audio/Rudi-Orang-Dalam.wav -i public/audio/orang-dalam-bed.wav -filter_complex "[1:a]volume=1.0[a1];[2:a]volume=0.68[a2];[a1][a2]amix=inputs=2:duration=longest:normalize=0[a]" -map 0:v -map "[a]" -c:v copy -c:a aac -b:a 192k -shortest Rudi_Orang_Dalam_Final.mp4
          ffprobe -v error -show_entries format=duration,size -of default=noprint_wrappers=1 Rudi_Orang_Dalam_Final.mp4
          ls -la *.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: Rudi_Final
          path: Rudi_Orang_Dalam_Final.mp4
          retention-days: 30
